name: Build Main Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: grtblog-server
            dockerfile: deploy/docker/server.Dockerfile
          - name: grtblog-renderer
            dockerfile: deploy/docker/web.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:main
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          build-args: |
            APP_VERSION=main
            BUILD_COMMIT=${{ github.sha }}
            NODE_OPTIONS=--max-old-space-size=768
          cache-from: type=gha,scope=main-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=main-${{ matrix.name }}
